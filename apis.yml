name: Gatik
description: 'Gatik is an autonomous trucking company founded in 2017 by Gautam Narang,
  Arjun Narang and Apeksha Kumavat, headquartered in Silicon Valley, California. Gatik
  builds and operates the Gatik Driver, an SAE Level 4 autonomy system purpose-built
  for the middle mile: short-haul, repeatable freight routes between distribution centers,
  dark stores and retail endpoints. Gatik runs driverless medium-duty box trucks in
  commercial service for Fortune 50 retailers and grocers including Walmart, Loblaw,
  Kroger, Tyson Foods, Pitney Bowes and PepsiCo, across Texas, Arkansas, Arizona, Ontario
  and other North American markets. The company partners with Isuzu, Ryder, Goodyear
  and NVIDIA, runs the Gatik Arena simulation platform, and publishes no public developer
  API, OpenAPI specification, SDK or developer portal — its surface is a corporate marketing
  site plus a legacy archive site carrying about, safety, news, careers and legal pages.'
